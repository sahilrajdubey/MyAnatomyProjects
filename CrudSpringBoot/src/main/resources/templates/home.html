<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
      margin-bottom: 20px;
    }

    .logout-btn {
      padding: 8px 16px;
      background-color: #dc3545;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
    }

    .logout-btn:hover {
      background-color: #bd2130;
    }

    /* Cards Section */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 6px;
      border-left: 4px solid #007bff;
    }

    .stat-card h4 {
      font-size: 13px;
      color: #6c757d;
      margin-bottom: 5px;
    }

    .stat-card p {
      font-size: 22px;
      font-weight: bold;
    }

    /* Table Section */
    .table-container h3 {
      margin-bottom: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #f1f1f1;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>Welcome Back!</h2>
      <a href="login.html" class="logout-btn">Logout</a>
    </div>

    <!-- Quick Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <h4>Total Sales</h4>
        <p>$12,450</p>
      </div>
      <div class="stat-card">
        <h4>Orders</h4>
        <p>128</p>
      </div>
      <div class="stat-card">
        <h4>Products</h4>
        <p>45</p>
      </div>
    </div>

    <!-- Data Table -->
    <div class="table-container">
      <h3>Recent Orders</h3>
      <table>
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Status</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>#1001</td>
            <td>John Doe</td>
            <td>Completed</td>
            <td>$120.00</td>
          </tr>
          <tr>
            <td>#1002</td>
            <td>Jane Smith</td>
            <td>Pending</td>
            <td>$85.50</td>
          </tr>
          <tr>
            <td>#1003</td>
            <td>Bob Johnson</td>
            <td>Shipped</td>
            <td>$210.00</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</body>
</html>
